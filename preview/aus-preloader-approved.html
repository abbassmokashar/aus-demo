<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AUS Preloader — Approved Version</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f1728; }
    .preview { display: grid; min-height: 100%; place-items: center; background: #0f1728; perspective: 1200px; }
    .logo {
      display: block;
      width: min(30vw, 270px);
      height: auto;
      transform-origin: 50% 50%;
      animation: professionalPreloader 3.2s cubic-bezier(.45,0,.55,1) infinite;
      animation-play-state: paused;
      visibility: hidden;
      will-change: transform;
    }
    .logo.is-ready {
      visibility: visible;
      animation-play-state: running;
    }
    @keyframes professionalPreloader {
      0%, 100% { transform: rotateY(-2.5deg) scale(.965); }
      25% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(2.5deg) scale(1.012); }
      75% { transform: rotateY(0deg) scale(1); }
    }
    @media (max-width: 600px) {
      .logo { width: min(54vw, 230px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
    }
  </style>
</head>
<body>
  <main class="preview" aria-label="AUS logo animation concept">
    <img class="logo" src="aus-preloader-logo.webp" alt="AUS emblem" width="540" height="591" decoding="async" fetchpriority="high" onload="this.classList.add('is-ready')">
  </main>
</body>
</html>
