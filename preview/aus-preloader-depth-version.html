<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AUS Preloader — Dimensional Version</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0f1728;
    }
    .preview {
      display: grid;
      min-height: 100%;
      place-items: center;
      background: #0f1728;
      perspective: 900px;
      perspective-origin: 50% 48%;
    }
    .logo-stage {
      width: min(30vw, 270px);
      transform-style: preserve-3d;
      animation: dimensionalPreloader 4.4s cubic-bezier(.42,0,.24,1) infinite;
      animation-play-state: paused;
      visibility: hidden;
      will-change: transform;
    }
    .logo-stage.is-ready {
      visibility: visible;
      animation-play-state: running;
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
      transform: translateZ(18px);
      backface-visibility: hidden;
    }
    @keyframes dimensionalPreloader {
      0%   { transform: rotateX(0deg) rotateY(0deg) translateZ(0) scale(.965); }
      18%  { transform: rotateX(-1.5deg) rotateY(-8deg) translateZ(18px) scale(1); }
      38%  { transform: rotateX(0deg) rotateY(0deg) translateZ(24px) scale(1.012); }
      62%  { transform: rotateX(1.5deg) rotateY(8deg) translateZ(18px) scale(1); }
      82%  { transform: rotateX(0deg) rotateY(0deg) translateZ(8px) scale(.992); }
      100% { transform: rotateX(0deg) rotateY(0deg) translateZ(0) scale(.965); }
    }
    @media (max-width: 600px) {
      .logo-stage { width: min(54vw, 230px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-stage { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="preview" aria-label="AUS dimensional logo animation concept">
    <div class="logo-stage">
      <img class="logo" src="aus-preloader-logo.webp" alt="AUS emblem" width="540" height="591" decoding="async" fetchpriority="high" onload="this.parentElement.classList.add('is-ready')">
    </div>
  </main>
</body>
</html>
