<script>
(function () {

  /* =========================================
     CONFIGURATION
  ========================================== */

  const API_URL =
    "https://aus-ai-assistant.a-mokashar.workers.dev";


  const launcher =
    document.getElementById(
      "aus-ai-launcher"
    );


  const chatWindow =
    document.getElementById(
      "aus-ai-window"
    );


  const closeButton =
    document.getElementById(
      "aus-ai-close"
    );


  const content =
    document.getElementById(
      "aus-ai-content"
    );


  const messages =
    document.getElementById(
      "aus-ai-messages"
    );


  const input =
    document.getElementById(
      "aus-ai-input"
    );


  const sendButton =
    document.getElementById(
      "aus-ai-send"
    );


  let conversationHistory = [];


  /* =========================================
     SESSION HISTORY
  ========================================== */

  try {

    const saved =
      sessionStorage.getItem(
        "aus-ai-history"
      );


    if (saved) {

      const parsed =
        JSON.parse(saved);


      if (
        Array.isArray(parsed)
      ) {

        conversationHistory =
          parsed.slice(-8);


        conversationHistory
          .forEach(function (item) {

            renderMessage(
              item.content,
              item.role === "assistant"
                ? "bot"
                : "user",
              false
            );

          });

      }

    }

  } catch (error) {

    console.warn(
      "AUS chat history unavailable.",
      error
    );

  }


  function saveHistory() {

    try {

      sessionStorage.setItem(
        "aus-ai-history",
        JSON.stringify(
          conversationHistory.slice(-8)
        )
      );

    } catch (error) {

      /* Ignore storage errors */

    }

  }


  /* =========================================
     OPEN / CLOSE
  ========================================== */

  launcher.addEventListener(
    "click",
    function () {

      chatWindow
        .classList
        .add(
          "aus-open"
        );


      setTimeout(
        function () {

          input.focus();

        },
        250
      );

    }
  );


  closeButton.addEventListener(
    "click",
    function () {

      chatWindow
        .classList
        .remove(
          "aus-open"
        );

    }
  );


  /* =========================================
     SAFE TEXT / LINK HANDLING
  ========================================== */

  function escapeHTML(text) {

    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function formatBotText(text) {

    let safe =
      escapeHTML(text);


    /* clickable URLs */

    safe =
      safe.replace(
        /(https?:\/\/[^\s<]+)/g,
        function (url) {

          let clean =
            url;


          let punctuation =
            "";


          while (
            /[.,;!?)]$/.test(
              clean
            )
          ) {

            punctuation =
              clean.slice(-1)
              +
              punctuation;


            clean =
              clean.slice(
                0,
                -1
              );

          }


          return (
            '<a href="' +
            clean +
            '" target="_blank" rel="noopener noreferrer">' +
            clean +
            "</a>" +
            punctuation
          );

        }
      );


    /* paragraphs */

    const paragraphs =
      safe
        .split(
          /\n{2,}/
        )
        .map(
          function (paragraph) {

            return (
              "<p>" +
              paragraph
                .replace(
                  /\n/g,
                  "<br>"
                )
              +
              "</p>"
            );

          }
        )
        .join("");


    return paragraphs;

  }


  /* =========================================
     MESSAGE RENDERING
  ========================================== */

  function renderMessage(
    text,
    sender,
    scroll = true
  ) {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "aus-message-row " +
      sender;


    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "aus-message " +
      sender;


    if (
      sender === "bot"
    ) {

      bubble.innerHTML =
        formatBotText(
          text
        );

    } else {

      bubble.textContent =
        text;

    }


    row.appendChild(
      bubble
    );


    messages.appendChild(
      row
    );


    if (scroll) {

      scrollToBottom();

    }


    return row;

  }


  function renderTyping() {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "aus-message-row bot";


    row.innerHTML = `
      <div class="aus-message bot aus-typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    `;


    messages.appendChild(
      row
    );


    scrollToBottom();


    return row;

  }


  function scrollToBottom() {

    setTimeout(
      function () {

        content.scrollTop =
          content.scrollHeight;

      },
      30
    );

  }


  /* =========================================
     INPUT AUTO HEIGHT
  ========================================== */

  input.addEventListener(
    "input",
    function () {

      input.style.height =
        "auto";


      input.style.height =
        Math.min(
          input.scrollHeight,
          90
        )
        +
        "px";

    }
  );


  /* =========================================
     SEND MESSAGE
  ========================================== */

  async function askAUS(
    question
  ) {

    question =
      String(
        question || ""
      )
      .trim();


    if (!question) {
      return;
    }


    if (
      sendButton.disabled
    ) {

      return;
    }


    renderMessage(
      question,
      "user"
    );


    conversationHistory.push({
      role:
        "user",

      content:
        question
    });


    conversationHistory =
      conversationHistory
        .slice(-8);


    saveHistory();


    input.value =
      "";


    input.style.height =
      "auto";


    input.disabled =
      true;


    sendButton.disabled =
      true;


    const typing =
      renderTyping();


    try {

      const response =
        await fetch(
          API_URL,
          {

            method:
              "POST",


            headers: {

              "Content-Type":
                "application/json"

            },


            body:
              JSON.stringify({

                message:
                  question,

                pageUrl:
                  window.location.href,

                pageTitle:
                  document.title,

                history:
                  conversationHistory
                    .slice(
                      0,
                      -1
                    )

              })

          }
        );


      const data =
        await response.json();


      typing.remove();


      if (
        !response.ok
      ) {

        throw new Error(
          data.error ||
          "Request failed."
        );

      }


      const answer =
        String(
          data.answer ||
          "I couldn't find enough information to answer that."
        );


      renderMessage(
        answer,
        "bot"
      );


      conversationHistory.push({
        role:
          "assistant",

        content:
          answer
      });


      conversationHistory =
        conversationHistory
          .slice(-8);


      saveHistory();


    } catch (error) {

      typing.remove();


      renderMessage(
        "I'm temporarily unable to answer. You can visit https://www.aus.swiss/contact-us to contact AUS directly.",
        "bot"
      );


      console.error(
        "AUS Assistant error:",
        error
      );

    }


    input.disabled =
      false;


    sendButton.disabled =
      false;


    input.focus();

  }


  /* =========================================
     SEND EVENTS
  ========================================== */

  sendButton.addEventListener(
    "click",
    function () {

      askAUS(
        input.value
      );

    }
  );


  input.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();


        askAUS(
          input.value
        );

      }

    }
  );


  /* =========================================
     QUICK ACTIONS
  ========================================== */

  document
    .querySelectorAll(
      ".aus-quick-action"
    )
    .forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            const link =
              button.getAttribute(
                "data-link"
              );


            const question =
              button.getAttribute(
                "data-question"
              );


            if (link) {

              window.location.href =
                link;

              return;

            }


            if (question) {

              askAUS(
                question
              );

            }

          }
        );

      }
    );


})();
</script>
